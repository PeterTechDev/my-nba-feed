name: Daily NBA Digest

on:
  schedule:
    # 08:00 America/Bahia (UTC-3).
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      replace_today:
        description: 'Regenerate and replace today’s edition (manual recovery only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-nba-digest
  cancel-in-progress: false

jobs:
  keep-schedule-active:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Renew workflow activation before GitHub's inactivity limit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/digest.yml/enable"
          workflow_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/digest.yml" --jq '.state')
          test "$workflow_state" = active
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/digest.yml" --jq '{state, updated_at}'
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.1'
      - name: Check generator and publisher
        run: node --experimental-strip-types --test tests/digest-generator.test.mjs tests/digest-publisher.test.mjs
      - name: Start the free CPU model inside this cloud runner
        shell: bash
        run: |
          set -euo pipefail
          task_model_dir="$RUNNER_TEMP/digest-model"
          mkdir -p "$task_model_dir"
          curl --fail --location --retry 3 --output "$task_model_dir/llama.tar.gz" \
            https://github.com/ggml-org/llama.cpp/releases/download/b11928/llama-b11928-bin-ubuntu-x64.tar.gz
          echo "c4fdc4b9913c3fc7b0ede9ed1970a43271aff7366889444797e05472f7c365da  $task_model_dir/llama.tar.gz" | sha256sum --check
          tar -xzf "$task_model_dir/llama.tar.gz" -C "$task_model_dir"
          for part in 00001 00002; do
            curl --fail --location --retry 3 --output "$task_model_dir/qwen2.5-7b-instruct-q4_k_m-$part-of-00002.gguf" \
              "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/bb5d59e06d9551d752d08b292a50eb208b07ab1f/qwen2.5-7b-instruct-q4_k_m-$part-of-00002.gguf"
          done
          echo "dfce12e3862a5283ccfb88221b48480e58745165de856439950d0f22590580db  $task_model_dir/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf" | sha256sum --check
          echo "539cf93f78e887edea1c04e2d7d8cdaca9d01dae9c9025bcb8accbe29df3d72a  $task_model_dir/qwen2.5-7b-instruct-q4_k_m-00002-of-00002.gguf" | sha256sum --check
          "$task_model_dir/llama-b11928/llama-server" --model "$task_model_dir/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf" \
            --host 127.0.0.1 --port 8080 --threads 4 --ctx-size 4096 --parallel 1 \
            --alias qwen2.5-7b-instruct > "$RUNNER_TEMP/digest-model.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/digest-model.pid"
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/health; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/digest-model.pid")" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -60 "$RUNNER_TEMP/digest-model.log"
          exit 1
      - name: Generate, publish and verify the daily edition
        run: npm run digest:generate
        env:
          DIGEST_PUBLISH_TOKEN: ${{ secrets.DIGEST_PUBLISH_TOKEN }}
          DIGEST_REPLACE_TODAY: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_today && 'true' || 'false' }}
      - name: Stop the temporary model server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/digest-model.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/digest-model.pid")" 2>/dev/null || true
          fi
