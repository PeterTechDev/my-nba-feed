name: Preview bypass tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-playwright:
    name: local bypass specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/bypass-redirect.spec.mjs tests/bypass-fetch-failure.spec.mjs --retries=0 --workers=1
