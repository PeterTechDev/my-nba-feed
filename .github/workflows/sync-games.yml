name: NBA Games Sync
on:
  schedule:
    # 06:35, 14:35, 22:35 America/Bahia (UTC-3).
    - cron: '35 1,9,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-games-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    environment: YOUTUBE_API_KEY
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - run: node --test tests/sync-games.test.mjs
      - run: node scripts/sync-games.mjs
        env:
          DIGEST_PUBLISH_TOKEN: ${{ secrets.DIGEST_PUBLISH_TOKEN }}
